<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>skillframe Studio</title>
  <style>
    :root {
      color-scheme: light dark; font-family: system-ui, sans-serif; font-size: 13px;
      --line: color-mix(in srgb, CanvasText 14%, transparent);
      --soft: color-mix(in srgb, CanvasText 5%, transparent);
      --muted: color-mix(in srgb, CanvasText 58%, transparent);
      --danger: #C4321C;
    }
    @media (prefers-color-scheme: dark) { :root { --danger: #FF7B66; } }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; background: Canvas; color: CanvasText; }
    button, input { font: inherit; color: inherit; }
    button { background: none; border: 1px solid transparent; border-radius: 5px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
    button:hover { background: var(--soft); }
    button:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 2px solid Highlight; outline-offset: 1px; }
    [hidden] { display: none !important; }

    /* the studio: sidebar, divider, then the project */
    #studio { height: 100vh; display: grid; grid-template-columns: var(--side, 400px) 6px minmax(0, 1fr); }
    skillframe-chat { min-width: 0; min-height: 0; }
    #divider { cursor: col-resize; border-left: 1px solid var(--line); touch-action: none; }
    #divider:hover, #divider.dragging { background: color-mix(in srgb, Highlight 30%, transparent); }
    #project { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    #bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); min-width: 0; }
    #name { font-weight: 600; padding: 0 4px; max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #address { flex: 1; min-width: 80px; border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; background: var(--soft);
      font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    #errors-btn { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
    #errors { border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--danger) 7%, Canvas); padding: 8px 12px; max-height: 30vh; overflow: auto; }
    #errors ul { margin: 0 0 8px; padding: 0 0 0 18px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
    #errors li + li { margin-top: 4px; }
    #errors .row { display: flex; gap: 6px; }
    #errors .row button { border-color: var(--line); }
    #run-btn { display: inline-flex; align-items: center; gap: 6px; border-color: var(--line); }
    #run-btn i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    #run-btn[data-state="running"] i { background: #2E9D5B; }
    #run-btn[data-state="starting"] i, #run-btn[data-state="installing"] i { background: #C98A12; animation: pulse 1.2s ease-in-out infinite; }
    #run-btn[data-state="exited"] { color: var(--danger); }
    #run-btn[data-state="exited"] i { background: var(--danger); }
    @keyframes pulse { 50% { opacity: .3; } }
    #logs { border-bottom: 1px solid var(--line); background: var(--soft); display: flex; flex-direction: column; max-height: 40vh; min-height: 0; }
    #logs .row { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
    #logs .row code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
    #logs .row button { border-color: var(--line); }
    #logs pre { margin: 0; padding: 8px 12px; overflow: auto; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    #stage { position: relative; flex: 1; min-height: 0; display: flex; }
    iframe { flex: 1; min-height: 0; width: 100%; border: 0; display: block; }
    #cover { position: absolute; inset: 0; display: grid; place-items: center; background: Canvas; padding: 24px; overflow: auto; }
    #cover > div { max-width: 520px; width: 100%; }
    #cover h2 { font-size: 15px; margin: 0 0 6px; }
    #cover p { color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
    #cover pre { margin: 0 0 12px; max-height: 30vh; overflow: auto; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--soft); border-radius: 6px; padding: 8px 10px; }
    #cover .row { display: flex; gap: 6px; flex-wrap: wrap; }
    #cover .row button { border-color: var(--line); }
    @media (prefers-reduced-motion: reduce) { #run-btn i { animation: none !important; } }

    /* opening a project */
    #start { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    #start > div { width: min(560px, 100%); }
    #start h1 { font-size: 22px; margin: 0 0 6px; }
    #start p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; font-size: 14px; }
    #start form { display: flex; gap: 6px; }
    #folder { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 14px; background: Canvas; }
    #start form button { border-color: var(--line); padding: 7px 12px; font-size: 14px; }
    #start form button[type=submit] { background: Highlight; color: HighlightText; border-color: Highlight; }
    #open-error { color: var(--danger); min-height: 1.5em; margin: 8px 0 0; font-size: 13px; }
    #recent h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 18px 0 6px; }
    #recent ul { list-style: none; margin: 0; padding: 0; }
    #recent button { width: 100%; text-align: left; display: grid; gap: 1px; padding: 7px 10px; }
    #recent b { font-weight: 600; font-size: 14px; }
    #recent span { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    #cancel { margin-top: 14px; }

    @media (max-width: 760px) {
      #studio { grid-template-columns: minmax(0, 1fr); grid-template-rows: 45vh minmax(0, 1fr); }
      #divider { display: none; }
      skillframe-chat { border-bottom: 1px solid var(--line); }
      #name, #open-out { display: none; }
    }
  </style>
</head>
<body>
  <section id="start" hidden>
    <div>
      <h1>Open a project</h1>
      <p>The agent works in the folder you open, and the folder's page runs next to it. When a file changes, the page reloads.</p>
      <form id="open-form">
        <input id="folder" placeholder="Paste a folder path, such as E:\Projects\my-site" autocomplete="off" spellcheck="false" aria-label="Project folder">
        <button type="button" id="browse" hidden>Browse…</button>
        <button type="submit">Open</button>
      </form>
      <p id="open-error" role="alert"></p>
      <div id="recent" hidden><h2>Recent</h2><ul></ul></div>
      <button type="button" id="cancel" hidden>Back to the project</button>
    </div>
  </section>

  <section id="studio" hidden>
    <skillframe-chat endpoint="/sf"></skillframe-chat>
    <div id="divider" role="separator" aria-orientation="vertical" aria-label="Sidebar width"></div>
    <div id="project">
      <div id="bar">
        <span id="name"></span>
        <input id="address" aria-label="Address shown" spellcheck="false" autocomplete="off">
        <button id="run-btn" hidden title="The project's own server: its output, and restart"><i></i><span></span></button>
        <button id="reload" title="Reload the page">Reload</button>
        <button id="errors-btn" hidden></button>
        <button id="open-out" title="Open this address in your browser">Open in browser</button>
        <button id="restart" title="Restart the studio's server, to pick up changes to its own code; the chats go on" hidden>Restart server</button>
        <button id="switch">Switch folder</button>
      </div>
      <div id="errors" hidden>
        <ul></ul>
        <div class="row"><button id="fix">Ask the agent to fix these</button><button id="clear">Dismiss</button></div>
      </div>
      <div id="logs" hidden>
        <div class="row"><code id="run-cmd"></code><button id="run-restart">Restart</button><button id="logs-close">Close</button></div>
        <pre id="log"></pre>
      </div>
      <div id="stage">
        <iframe id="view" title="The project's page"></iframe>
        <div id="cover" hidden><div><h2 id="cover-title"></h2><p id="cover-text"></p><pre id="cover-log"></pre>
          <div class="row"><button id="cover-fix" hidden>Ask the agent to fix it</button><button id="cover-restart">Restart</button></div></div></div>
      </div>
    </div>
  </section>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    // the page speaks the browser's language: English, or Chinese
    const ZH = (navigator.language || "").toLowerCase().startsWith("zh");
    const L = (en, zh) => (ZH ? zh : en);
    if (ZH) {
      document.documentElement.lang = "zh";
      const text = { "#start h1": "打开一个项目", "#start > div > p": "Agent 在你打开的文件夹里干活，旁边运行这个项目的页面。文件一改，页面就会刷新。", "#browse": "浏览…",
        "#open-form button[type=submit]": "打开", "#recent h2": "最近打开", "#cancel": "回到项目", "#reload": "刷新", "#open-out": "在浏览器中打开", "#restart": "重启 Studio",
        "#switch": "换文件夹", "#fix": "让 agent 修好这些", "#clear": "忽略", "#run-restart": "重启", "#logs-close": "关闭", "#cover-fix": "让 agent 修好它", "#cover-restart": "重启" };
      for (const [sel, t] of Object.entries(text)) document.querySelector(sel).textContent = t;
      const titles = { "#run-btn": "项目自己的服务器：看输出、重启", "#reload": "重新加载页面", "#open-out": "在你的浏览器里打开这个地址",
        "#restart": "重启 Studio 自己的服务器（改了 Studio 的代码时用），对话不受影响" };
      for (const [sel, t] of Object.entries(titles)) document.querySelector(sel).title = t;
      $("folder").placeholder = String.raw`粘贴文件夹路径，例如 E:\Projects\my-site`;
      $("folder").setAttribute("aria-label", "项目文件夹");
    }
    // the start screen has no sidebar yet: this stream tells the window's script the page is open
    new EventSource("/sf/events");
    const state = await (await fetch("/studio/state")).json();
    let chat = null;
    let errors = [];
    let page = {};

    // ----- opening a project
    function showStart() {
      $("start").hidden = false;
      $("studio").hidden = true;
      $("browse").hidden = !state.canBrowse;
      $("cancel").hidden = !state.project;
      const others = state.recent.filter((f) => f !== state.project?.folder);
      $("recent").hidden = !others.length;
      $("recent").querySelector("ul").replaceChildren(...others.map((f) => {
        const li = document.createElement("li");
        const b = document.createElement("button");
        const name = document.createElement("b");
        name.textContent = f.split(/[\\/]/).filter(Boolean).pop() ?? f;
        const where = document.createElement("span");
        where.textContent = f;
        b.append(name, where);
        b.onclick = () => openFolder(f);
        li.append(b);
        return li;
      }));
      $("folder").focus();
    }

    async function openFolder(folder) {
      $("open-error").textContent = "";
      if (!folder.trim()) return void ($("open-error").textContent = L("Type or paste the path of a folder first.", "先输入或粘贴一个文件夹路径。"));
      const r = await fetch("/studio/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ folder: folder.trim().replace(/^"|"$/g, "") }) });
      if (r.ok) location.reload();
      else {
        const { error } = await r.json();
        const bad = /^(.*) is not a folder\.$/.exec(error ?? "");
        $("open-error").textContent = ZH && bad ? `找不到这个文件夹：${bad[1]}` : error;
      }
    }

    $("open-form").onsubmit = (e) => { e.preventDefault(); openFolder($("folder").value); };
    $("browse").onclick = async () => {
      $("browse").disabled = true;
      const { folder } = await (await fetch("/studio/browse", { method: "POST" })).json();
      $("browse").disabled = false;
      if (folder) openFolder(folder);
    };
    $("cancel").onclick = () => { $("start").hidden = true; $("studio").hidden = false; };

    // ----- the studio
    async function showStudio() {
      await import("/sf/ui/skillframe-chat.js");
      chat = document.querySelector("skillframe-chat");
      $("start").hidden = true;
      $("studio").hidden = false;
      $("restart").hidden = !state.canRestart;
      $("name").textContent = state.project.name;
      $("name").title = state.project.folder;
      document.title = `${state.project.name} · skillframe Studio`;
      show(state.project.run?.url ?? state.project.preview);
      drawRun(state.project.run);
      chat.addEventListener("sf:studio-show", (e) => show(e.detail.url));
      chat.addEventListener("sf:studio-run", (e) => drawRun(e.detail));
      chat.addEventListener("sf:studio-switched", () => setTimeout(() => location.reload(), 300));
    }

    function show(url) {
      $("view").src = url;
      $("address").value = url;
      page = { url };
      tell();
    }

    // what the agent hears with each message (and what the sidebar says it sees)
    const tell = () => chat?.setScreen({ ...page, errors: errors.slice(-10) }, page.title ? `${page.title} (${page.path ?? page.url})` : page.url ?? "");

    // ----- the project's own server (stacks.js): its state on a button, its output under it
    let run = null;
    const RUN_TEXT = ZH ? { installing: "安装依赖中", starting: "启动中", running: "运行中", exited: "已停止" } : { installing: "installing", starting: "starting", running: "running", exited: "stopped" };
    function drawRun(st) {
      run = st;
      $("run-btn").hidden = !st;
      $("cover").hidden = true;
      if (!st) { $("logs").hidden = true; return; }
      $("run-btn").dataset.state = st.state;
      $("run-btn").querySelector("span").textContent = `${st.stack} · ${RUN_TEXT[st.state] ?? st.state}`;
      $("run-cmd").textContent = st.command;
      $("run-cmd").title = st.command;
      if (st.state !== "running") {
        $("cover").hidden = false;
        $("cover-title").textContent = st.state === "exited" ? L(`${st.stack} stopped`, `${st.stack} 已停止`)
          : st.state === "installing" ? L(`Installing ${st.stack}'s dependencies…`, `正在安装 ${st.stack} 的依赖…`) : L(`Starting ${st.stack}…`, `正在启动 ${st.stack}…`);
        $("cover-text").textContent = st.state === "exited" ? L(`"${st.command}" ended with code ${st.code}. Its last output:`, `"${st.command}" 退出了（退出码 ${st.code}）。最后的输出：`)
          : L(`Running "${st.command}". The page shows here once it is up.`, `正在运行 "${st.command}"，启动好后页面会显示在这里。`);
        $("cover-fix").hidden = st.state !== "exited";
      }
      loadLog();
    }
    let logTimer = null;
    async function loadLog() {
      clearTimeout(logTimer);
      const { log } = await (await fetch("/studio/run/logs")).json().catch(() => ({ log: "" }));
      for (const id of ["log", "cover-log"]) {
        const el = $(id);
        const end = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
        el.textContent = log;
        if (end) el.scrollTop = el.scrollHeight;
      }
      // follow the output while someone is looking at it
      if (run && (!$("logs").hidden || !$("cover").hidden)) logTimer = setTimeout(loadLog, 1000);
    }
    $("run-btn").onclick = () => { $("logs").hidden = !$("logs").hidden; loadLog(); };
    $("logs-close").onclick = () => { $("logs").hidden = true; };
    const restartRun = async () => {
      await fetch("/studio/run/restart", { method: "POST" }).catch(() => {});
      loadLog();
    };
    $("run-restart").onclick = restartRun;
    $("cover-restart").onclick = restartRun;
    $("cover-fix").onclick = () => chat.ask({
      prompt: `The project's server stopped ("${run.command}", exit code ${run.code}). Its last output:\n${$("cover-log").textContent.split("\n").slice(-40).join("\n")}\nFind the cause, fix it, then call restart_app.`,
      shown: L("Fix the server and restart it", "修好服务器并重启"),
    });

    addEventListener("message", (e) => {
      const m = e.data?.studio;
      if (!m || e.source !== $("view").contentWindow) return;
      if (m.type === "start") { errors = []; drawErrors(); }
      if (m.type === "page") {
        page = { url: e.origin + m.path, path: m.path, title: m.title };
        $("address").value = page.url;
      }
      if (m.type === "error") { errors.push(m.text); drawErrors(); }
      tell();
    });

    function drawErrors() {
      $("errors-btn").hidden = !errors.length;
      $("errors-btn").textContent = ZH ? `${errors.length} 个错误` : errors.length === 1 ? "1 error" : `${errors.length} errors`;
      if (!errors.length) $("errors").hidden = true;
      $("errors").querySelector("ul").replaceChildren(...errors.slice(-20).map((t) => Object.assign(document.createElement("li"), { textContent: t })));
    }
    $("errors-btn").onclick = () => { $("errors").hidden = !$("errors").hidden; };
    $("clear").onclick = () => { errors = []; drawErrors(); tell(); };
    $("fix").onclick = () => {
      $("errors").hidden = true;
      chat.ask({ prompt: `The page in the main area shows these errors:\n${errors.map((t) => `- ${t}`).join("\n")}\nFind the cause and fix it.`, shown: L("Fix the errors on the page", "修好页面上的错误") });
    };

    $("address").addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const v = $("address").value.trim();
      show(v.startsWith("/") ? state.project.preview + v.slice(1) : /^https?:\/\//.test(v) ? v : `http://${v}`);
    });
    // a cross-origin frame can't be told to reload: loading its address again does the same
    $("reload").onclick = () => { $("view").src = page.url ?? state.project.preview; };
    $("switch").onclick = showStart;
    $("open-out").onclick = () => window.open(page.url ?? state.project.preview, "_blank");

    $("restart").onclick = async () => {
      $("restart").disabled = true;
      $("restart").textContent = L("Restarting…", "正在重启…");
      await fetch("/studio/restart", { method: "POST" }).catch(() => {});
      await new Promise((r) => setTimeout(r, 500));
      for (let i = 0; i < 100; i++) {
        try { if ((await fetch("/studio/state")).ok) return location.reload(); } catch {}
        await new Promise((r) => setTimeout(r, 300));
      }
      $("restart").textContent = L("Server didn't come back", "服务器没能重新启动");
    };

    // the divider: drag it to give the sidebar or the page more room
    const divider = $("divider");
    const studio = $("studio");
    const setWidth = (px) => studio.style.setProperty("--side", Math.max(260, Math.min(px, innerWidth - 240)) + "px");
    try { const saved = Number(localStorage.getItem("side")); if (saved) setWidth(saved); } catch {}
    divider.addEventListener("pointerdown", (e) => {
      divider.setPointerCapture(e.pointerId);
      divider.classList.add("dragging");
      $("view").style.pointerEvents = "none"; // the frame would swallow the drag
    });
    divider.addEventListener("pointermove", (e) => { if (divider.classList.contains("dragging")) setWidth(e.clientX); });
    divider.addEventListener("pointerup", () => {
      divider.classList.remove("dragging");
      $("view").style.pointerEvents = "";
      try { localStorage.setItem("side", parseInt(getComputedStyle(studio).getPropertyValue("--side"))); } catch {}
    });

    if (state.project) await showStudio(); else showStart();
  </script>
</body>
</html>
