<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Todo</title>
  <!-- the sidebar: served by skillframe, which this page is opened through -->
  <script type="module" src="/sf/ui/skillframe-chat.js"></script>
  <script type="module" src="/sf/ui/skillframe-titlebar.js"></script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; font-size: 14px; --line: color-mix(in srgb, CanvasText 14%, transparent); --muted: color-mix(in srgb, CanvasText 58%, transparent); }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: Canvas; color: CanvasText; }
    .work { flex: 1; min-height: 0; display: grid; grid-template-columns: 380px minmax(0, 1fr); }
    skillframe-chat { min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
    main { padding: 28px 32px; overflow: auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 20px; }
    form { display: flex; gap: 6px; max-width: 520px; margin-bottom: 16px; }
    input { flex: 1; min-width: 0; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
    button { font: inherit; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; max-width: 520px; }
    li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    li:hover, li.sel { background: color-mix(in srgb, CanvasText 6%, transparent); }
    li.done span { text-decoration: line-through; color: var(--muted); }
    li .id { color: var(--muted); font-variant-numeric: tabular-nums; width: 2.5em; }
    @media (max-width: 760px) { .work { grid-template-columns: 1fr; grid-template-rows: 55% 1fr; } skillframe-chat { border-right: 0; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body>
  <!-- the page's own words are English only: its settings offer the theme -->
  <skillframe-titlebar settings="theme"></skillframe-titlebar>
  <div class="work">
    <skillframe-chat lang="en"></skillframe-chat>
    <main>
      <h1>Todos</h1>
      <p class="sub">The app is Python. Ask the agent on the left to add, finish or sort out todos.</p>
      <form id="add"><input id="text" placeholder="A new todo" aria-label="A new todo" autocomplete="off"><button>Add</button></form>
      <ul id="list"></ul>
    </main>
  </div>
  <script type="module">
    const chat = document.querySelector("skillframe-chat");
    let selected = null;
    async function draw() {
      const todos = await (await fetch("/todos")).json();
      document.getElementById("list").replaceChildren(...todos.map((t) => {
        const li = document.createElement("li");
        li.className = (t.done ? "done " : "") + (t.id === selected ? "sel" : "");
        li.innerHTML = `<span class="id">#${t.id}</span><span></span>`;
        li.lastChild.textContent = t.text;
        li.onclick = () => { selected = t.id; chat.setScreen({ selected }, `todo #${t.id}`); draw(); };
        return li;
      }));
    }
    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const text = document.getElementById("text").value.trim();
      if (!text) return;
      await fetch("/todos/add", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
      document.getElementById("text").value = "";
      draw();
    };
    // the agent changed todos.json (through the app's tools): redraw
    chat.addEventListener("file-changed", draw);
    draw();
  </script>
</body>
</html>
