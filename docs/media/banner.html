<!doctype html>
<!-- The README's banner. Rendered to banner-light.png / banner-dark.png by scripts/render-banner.mjs:
     the mark is a window whose narrow left pane is the agent and whose dashed right pane is left
     for the developer's app. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --ink: #1C1F24; --muted: #5B636E; --accent: #2F5FD0; --dash: #9AA1AA; --line: #fff; }
  :root[data-theme="dark"] { --ink: #E6E8EB; --muted: #A3AAB3; --accent: #7FA2FF; --dash: #6B727C; --line: #14171c; }
  html, body { margin: 0; background: transparent; }
  .banner { width: 1000px; height: 220px; display: flex; align-items: center; justify-content: center; gap: 34px;
    font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  .word { font-size: 76px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .tag { font-size: 25px; color: var(--muted); margin-top: 14px; letter-spacing: -0.005em; }
</style>
</head>
<body>
<div class="banner">
  <svg width="132" height="104" viewBox="0 0 66 52" aria-hidden="true">
    <rect x="2" y="2" width="62" height="48" rx="7" fill="none" stroke="var(--ink)" stroke-width="3"/>
    <path d="M9 2 H22 V50 H9 A7 7 0 0 1 2 43 V9 A7 7 0 0 1 9 2 Z" fill="var(--accent)"/>
    <rect x="7" y="12" width="10" height="3" rx="1.5" fill="var(--line)" opacity=".9"/>
    <rect x="7" y="19" width="7" height="3" rx="1.5" fill="var(--line)" opacity=".7"/>
    <rect x="7" y="38" width="10" height="5" rx="2" fill="var(--line)" opacity=".9"/>
    <rect x="28.5" y="8.5" width="29" height="35" rx="3" fill="none" stroke="var(--dash)" stroke-width="2" stroke-dasharray="4 3"/>
  </svg>
  <div>
    <div class="word">skillframe</div>
    <div class="tag">Your users' own coding agent, inside your app.</div>
  </div>
</div>
</body>
</html>
